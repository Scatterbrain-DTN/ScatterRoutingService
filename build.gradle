// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.1.20'
    ext.kotlinVersion = kotlin_version
    ext.hilt_version = '2.55'


    ext.rxJavaVersion = '2.2.17'
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath libs.agp
        classpath libs.org.jacoco.core
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath libs.google.services  // Google Services plugin
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.20-1.0.31' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "2.1.20" apply false // this version matches your Kotlin version
}

allprojects {
    apply plugin: 'jacoco'
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
