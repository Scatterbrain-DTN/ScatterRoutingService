plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.devtools.ksp'
}

ext.rxJavaVersion = '2.2.17'


java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
}
def protobuf_version = "4.30.2"

dependencies {
    annotationProcessor libs.dagger.compiler
    implementation("com.google.protobuf:protobuf-kotlin:$protobuf_version")
    ksp libs.dagger.compiler
    implementation "com.google.devtools.ksp:symbol-processing-api:2.3.9"
    implementation libs.kotlinpoet.ksp
    implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"

    implementation(project(':ser'))
}



repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
    gradlePluginPortal()
    maven {
        url "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent { snapshotsOnly() }
    }
}