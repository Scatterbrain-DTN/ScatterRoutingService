plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.devtools.ksp'
}

ext.rxJavaVersion = '2.2.17'


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
}
def protobuf_version = "4.30.2"

dependencies {
    annotationProcessor libs.dagger.compiler
    implementation("com.google.protobuf:protobuf-kotlin:$protobuf_version")
    ksp libs.dagger.compiler
    implementation "com.google.devtools.ksp:symbol-processing-api:2.1.20-2.0.0"
    implementation libs.kotlinpoet.ksp
    implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"

    implementation(project(':ser'))
}



repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
    gradlePluginPortal()
}